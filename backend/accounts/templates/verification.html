{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - LinkedIn Productivity</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'verify/css/verification.css'%}">
</head>
<body>
    <!-- Main Container - Centered vertically and horizontally -->
    <div class="verification-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                    
                    <!-- Verification Card -->
                    <div class="card verification-card shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            
                            <!-- Icon -->
                            <div class="text-center mb-4">
                                <div class="verification-icon">
                                    <i class="bi bi-envelope-check"></i>
                                </div>
                            </div>
                            
                            <!-- Title -->
                            <h1 class="text-center mb-3">Verify Your Email</h1>
                            
                            <!-- Instruction Text -->
                            <p class="text-center text-muted mb-4">
                                Click the button below to verify your email address and complete your registration for LinkedIn Productivity.
                            </p>
                            
                            <!-- Verify Button -->
                            <div class="text-center mb-3">
                                <button type="button" class="btn btn-primary btn-verify" id="verifyBtn">
                                    <i class="bi bi-check-circle me-2"></i>
                                    Verify Email
                                </button>
                            </div>
                            
                            <!-- Success Message (hidden by default) -->
                            <div class="alert alert-success verification-success d-none" id="successMessage" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <strong>User verified!</strong> Please login via Chrome Extension.
                            </div>
                            
                        </div>
                    </div>
                    
                    <!-- Footer Link -->
                    <div class="text-center mt-4">
                        <p class="text-muted small">
                            Need help? <a href="mailto:support@linkedinproductivity.com" class="text-decoration-none">Contact Support</a>
                        </p>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
   <script src="{% static 'verify/js/verification.js' %}"></script>
</body>
</html>
