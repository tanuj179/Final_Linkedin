<div id="leadsView" class="content-view" style="display: none;">

  <!-- Search and Filter Header -->
  <div class="card mb-4">
    <div class="card-body p-3 p-md-4">
      <div class="row g-3 align-items-center">
        <div class="col-12 col-md-auto">
          <h2 class="h3 mb-1">My Leads</h2>
          <p class="text-muted mb-0 small" id="leadsCount">0 leads found</p>
        </div>
        <div class="col-12 col-md">
          <div class="row g-2">
            <div class="col-12 col-sm">
              <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control" id="searchInput" placeholder="Search leads...">
              </div>
            </div>
            <div class="col-12 col-sm-auto">
              <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="bi bi-funnel"></i>
                </span>
                <select class="form-select" id="filterStatus">
                  <option value="all">All Tags</option>
                  <option value="prospect">Prospect</option>
                  <option value="hot">Hot</option>
                  <option value="warm">Warm</option>
                  <option value="cold">Cold</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-sm-auto">
              <button class="btn btn-gradient w-100" id="exportBtn">
                <i class="bi bi-download me-2"></i>
                <span>Export</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leads Table (Desktop) -->
 <div class="card" id="leadsTableCard">
    <div class="table-responsive">
      <table class="table leads-table mb-0">
        <thead class="gradient-header">
          <tr>
            <th>
              <div class="d-flex align-items-center gap-2">
                Contact
                <i class="bi bi-arrow-down-up small"></i>
              </div>
            </th>
            <th>
              <div class="d-flex align-items-center gap-2">
                Company
                <i class="bi bi-arrow-down-up small"></i>
              </div>
            </th>
            <th>Email</th>
            <th>
              <div class="d-flex align-items-center gap-2">
                Tags
                <i class="bi bi-arrow-down-up small"></i>
              </div>
            </th>
            <th>
              <div class="d-flex align-items-center gap-2">
                Added Date
                <i class="bi bi-arrow-down-up small"></i>
              </div>
            </th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <!-- Table rows will be inserted here by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Leads Cards (Mobile) -->
  <div id="leadsCards" class="mt-3">
    <!-- Lead cards will be inserted here by JavaScript -->
  </div>

  <!-- Pagination (single shared) -->
  <div class="d-flex justify-content-center mt-4" id="leadsPagination">
    <!-- Pagination buttons will be inserted here by JavaScript -->
  </div>

  <!-- Empty State -->
  <div class="card text-center py-5 d-none" id="emptyState">
    <div class="card-body">
      <div class="empty-icon mx-auto mb-3">
        <i class="bi bi-inbox" style="font-size: 48px; color: #9ca3af;"></i>
      </div>
      <h3 class="h5 mb-2">No leads yet</h3>
      <p class="text-muted">Start saving leads from LinkedIn profiles using the extension!</p>
    </div>
  </div>

</div>
