<div id="profileView" class="content-view">

  <!-- AI Profile Score Card -->
  <div class="card gradient-card mb-4">
    <div class="card-body p-3 p-md-4">
      <div class="row align-items-center g-3">
        <div class="col-12 col-md-auto text-center text-md-start">
          <div class="d-inline-flex flex-column flex-sm-row align-items-center gap-3">
            <div class="position-relative">
              <div class="score-circle">
                <div class="score-value" id="profileScoreValue">0</div>
                <div class="score-label">
                  / <span id="profileScoreMax">100</span>
                </div>
              </div>
              <div class="score-badge">
                <i class="bi bi-stars"></i>
              </div>
            </div>
            <div class="text-white text-center text-sm-start">
              <h2 class="h3 mb-2" id="profileScoreHeading">AI Profile Score</h2>
              <p class="mb-2 opacity-90" id="profileScoreSubtitle">Latest profile analysis</p>
              <div class="d-flex align-items-center gap-2 justify-content-center justify-content-sm-start">
                <i class="bi bi-award"></i>
                <span class="small" id="profileScoreBadgeText">Overall score: 0/100</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Reserved for future actions -->
        <div class="col-12 col-md-auto ms-md-auto d-none" id="profileScoreActions"></div>
      </div>
    </div>
  </div>

  <!-- Improvement Sections Grid -->
  <div class="mb-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-3">
        <div class="icon-box gradient-info">
          <i class="bi bi-magic"></i>
        </div>
        <div>
          <h3 class="h4 mb-0" id="improvementTipsHeading">Improvement Areas</h3>
          <p class="mb-0 text-muted small">AI-suggested changes grouped by section</p>
        </div>
      </div>
    </div>

    <!-- Sections container, cards injected by JS -->
    <div id="tipsList" class="profile-sections-grid">
      <!-- JS will render section cards here -->
    </div>
  </div>

    <!-- Profile Analysis History Table -->
  <div class="card" id="profileHistoryCard">
    <div class="card-body p-3 p-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="h4 mb-1">Profile Analysis History</h3>
          <p class="text-muted small mb-0" id="profileHistoryCount">0 analyses found</p>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table mb-0">
          <thead class="gradient-header">
            <tr>
              <th>
                <div class="d-flex align-items-center gap-2">
                  Date
                  <i class="bi bi-arrow-down-up small"></i>
                </div>
              </th>
              <th>
                <div class="d-flex align-items-center gap-2">
                  Score
                  <i class="bi bi-arrow-down-up small"></i>
                </div>
              </th>
              <th>
                <div class="d-flex align-items-center gap-2">
                  Section
                  <i class="bi bi-arrow-down-up small"></i>
                </div>
              </th>
              <th>
                <div class="d-flex align-items-center gap-2">
                  Status
                  <i class="bi bi-arrow-down-up small"></i>
                </div>
              </th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="profileHistoryBody">
            <!-- Rows by JS -->
          </tbody>
        </table>
      </div>

      <!-- Empty state for history -->
      <div class="text-center py-4 d-none" id="profileHistoryEmptyState">
        <div class="mb-2">
          <i class="bi bi-clock-history" style="font-size: 40px; color: #9ca3af;"></i>
        </div>
        <h4 class="h6 mb-1">No analyses yet</h4>
        <p class="text-muted small mb-0">Upload a profile screenshot to generate your first analysis.</p>
      </div>

      <!-- NEW: Pagination for history -->
      <div class="d-flex justify-content-center mt-3" id="profileHistoryPagination">
        <!-- Buttons by JS -->
      </div>
    </div>
  </div>


</div>
